# параметры соединения с Arduino
port = "COM4"
baud = 115200

# сопоставление кодов кнопок пульта с действиями
# коды определяются в режиме отладки, формат NEC_XX или RC5_XX
# список команд смотри в README.md
# префикс NEC_ или RC5_ определяется автоматически
#оба пульта могут работать одновременно
[buttons]
# ============ Пульт RC5 ============
"RC5_36" = "SYSTEM_SHUTDOWN"
"RC5_B"  = "VK_SPACE"
"RC5_12" = "VK_VOLUME_UP"
"RC5_13" = "VK_VOLUME_DOWN"
"RC5_30" = "VK_VOLUME_MUTE"
"RC5_28" = "VK_VOLUME_UP"
"RC5_2A" = "VK_VOLUME_DOWN"
"RC5_2D" = "VK_VOLUME_MUTE"
"RC5_17" = "VK_F"
"RC5_F"  = "VK_ESC"
"RC5_14" = "VK_LEFT"
"RC5_15" = "VK_RIGHT"
"RC5_16" = "VK_LEFT"
"RC5_10" = "VK_RIGHT"
"RC5_3C" = "VK_UP"
"RC5_11" = "VK_DOWN"
"RC5_2E" = "ALT_TAB"
"RC5_C"  = "ALT_F4"
"RC5_D"  = "WIN_D"
"RC5_3D" = "MOUSE_UP"
"RC5_3E" = "MOUSE_DOWN"
"RC5_3F" = "MOUSE_LEFT"
"RC5_2B" = "MOUSE_RIGHT"
"RC5_2C" = "L_CLICK"

# ============ Пульт NEC ============
"NEC_2" = "VK_VOLUME_UP"

# Полный справочник доступных команд для использования в блоке buttons
#   # Кнопка включения на пульте
#   - SYSTEM_SHUTDOWN
#   # Основные
#   - VK_SPACE
#   - VK_ENTER
#   - VK_ESC
#   - VK_BACKSPACE
#   - VK_TAB
#   - VK_CAPSLOCK
#   # Стрелки и навигация
#   - VK_LEFT
#   - VK_RIGHT
#   - VK_UP
#   - VK_DOWN
#   - VK_PAGEUP
#   - VK_PAGEDOWN
#   - VK_HOME
#   - VK_END
#   - VK_INSERT
#   - VK_DELETE
#   # Мультимедиа
#   - VK_VOLUME_UP
#   - VK_VOLUME_DOWN
#   - VK_VOLUME_MUTE
#   - VK_PLAY_PAUSE
#   - VK_NEXT
#   - VK_PREV
#   - VK_STOP
#   # Буквы
#   - VK_A-VK_Z
#   # Цифры
#   - VK_0-VK_9
#   # Функциональные
#   - VK_F1-VK_F12
#   # Системные
#   - VK_PRINT
#   - VK_PAUSE
#   - ALT_TAB
#   - WIN_D
#   - ALT_F4